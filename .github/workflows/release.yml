name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and package
        run: |
          chmod +x scripts/bundle_app.sh
          ./scripts/bundle_app.sh
          ditto -c -k --keepParent iJustLikeOrdinary.app iJustLikeOrdinary-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: iJustLikeOrdinary-${{ github.ref_name }}.zip
          generate_release_notes: true

